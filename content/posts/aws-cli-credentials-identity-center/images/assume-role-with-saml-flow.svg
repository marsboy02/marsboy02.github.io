<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 420"
     font-family="'Inter', 'Segoe UI', -apple-system, sans-serif">
  <defs>
    <filter id="s"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.12"/></filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1a1a2e"/>
    </marker>
  </defs>

  <rect width="780" height="420" fill="#f8fafc" rx="12"/>

  <text x="390" y="32" text-anchor="middle" font-size="18" font-weight="700" fill="#1a1a2e">AssumeRoleWithSAML — Credential Flow</text>

  <!-- Participants -->
  <rect x="25" y="55" width="130" height="40" rx="6" fill="#e8f4f8" stroke="#2980b9" stroke-width="2" filter="url(#s)"/>
  <text x="90" y="80" text-anchor="middle" font-size="14" font-weight="600" fill="#1a1a2e">Browser / Tool</text>

  <rect x="175" y="55" width="130" height="40" rx="6" fill="#f4e8f8" stroke="#8e44ad" stroke-width="2" filter="url(#s)"/>
  <text x="240" y="80" text-anchor="middle" font-size="14" font-weight="600" fill="#1a1a2e">IdP</text>

  <rect x="325" y="55" width="130" height="40" rx="6" fill="#fff3e0" stroke="#f39c12" stroke-width="2" filter="url(#s)"/>
  <text x="390" y="80" text-anchor="middle" font-size="14" font-weight="600" fill="#1a1a2e">AWS STS</text>

  <rect x="475" y="55" width="130" height="40" rx="6" fill="#f0f0f0" stroke="#555" stroke-width="2" filter="url(#s)"/>
  <text x="540" y="81" text-anchor="middle" font-size="13" font-weight="600" fill="#1a1a2e" font-family="'SF Mono', 'Fira Code', monospace">.aws/credentials</text>

  <rect x="625" y="55" width="130" height="40" rx="6" fill="#eaf7ee" stroke="#27ae60" stroke-width="2" filter="url(#s)"/>
  <text x="690" y="80" text-anchor="middle" font-size="14" font-weight="600" fill="#1a1a2e">CLI / SDK</text>

  <!-- Lifelines -->
  <line x1="90"  y1="95" x2="90"  y2="390" stroke="#bbb" stroke-width="1.5" stroke-dasharray="4,3"/>
  <line x1="240" y1="95" x2="240" y2="390" stroke="#bbb" stroke-width="1.5" stroke-dasharray="4,3"/>
  <line x1="390" y1="95" x2="390" y2="390" stroke="#bbb" stroke-width="1.5" stroke-dasharray="4,3"/>
  <line x1="540" y1="95" x2="540" y2="390" stroke="#bbb" stroke-width="1.5" stroke-dasharray="4,3"/>
  <line x1="690" y1="95" x2="690" y2="390" stroke="#bbb" stroke-width="1.5" stroke-dasharray="4,3"/>

  <!-- Message 1: Browser/Tool -> IdP -->
  <text x="165" y="125" text-anchor="middle" font-size="12" fill="#1a1a2e">1. SAML auth request</text>
  <line x1="90" y1="135" x2="232" y2="135" stroke="#1a1a2e" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Message 2: IdP -> Browser/Tool -->
  <text x="165" y="175" text-anchor="middle" font-size="12" fill="#1a1a2e">2. SAMLResponse (assertion)</text>
  <line x1="240" y1="185" x2="98" y2="185" stroke="#1a1a2e" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Message 3: Browser/Tool -> STS -->
  <text x="240" y="225" text-anchor="middle" font-size="12" fill="#1a1a2e">3. AssumeRoleWithSAML(assertion, role_arn)</text>
  <line x1="90" y1="235" x2="382" y2="235" stroke="#1a1a2e" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Message 4: STS -> Browser/Tool -->
  <text x="240" y="275" text-anchor="middle" font-size="12" fill="#1a1a2e">4. Temp credentials (ASIA + session token)</text>
  <line x1="390" y1="285" x2="98" y2="285" stroke="#1a1a2e" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Message 5: Browser/Tool -> credentials file -->
  <text x="315" y="325" text-anchor="middle" font-size="12" fill="#1a1a2e">5. Write to file</text>
  <line x1="90" y1="335" x2="532" y2="335" stroke="#1a1a2e" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Message 6: CLI/SDK -> credentials file -->
  <text x="615" y="375" text-anchor="middle" font-size="12" fill="#1a1a2e">6. Read for use</text>
  <line x1="690" y1="385" x2="548" y2="385" stroke="#1a1a2e" stroke-width="2" marker-end="url(#arrow)"/>
</svg>
