<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 236"
     font-family="'Pretendard', 'Apple SD Gothic Neo', 'Noto Sans KR', 'Malgun Gothic', 'Inter', -apple-system, sans-serif">
  <defs>
    <filter id="s"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.12"/></filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L10,5 L0,10 z" fill="#555"/>
    </marker>
    <style>
      .lane-t { font-size: 14px; font-weight: 700; }
      .box { fill: #ffffff; stroke: #555; stroke-width: 1.5; }
      .box-t { font-size: 13px; font-weight: 600; fill: #1a1a2e; text-anchor: middle; }
      .edge { stroke: #555; stroke-width: 1.8; fill: none; marker-end: url(#arrow); }
      .edge-t { font-size: 11px; fill: #555; }
    </style>
  </defs>

  <rect width="860" height="236" fill="#f8fafc" rx="12"/>


<g transform="translate(0,-36)">
  <!-- lane: infra change -->
  <rect x="20" y="56" width="820" height="86" rx="10" fill="#f4e8f8" stroke="#8e44ad" stroke-width="2"/>
  <text x="40" y="104" class="lane-t" fill="#8e44ad">인프라 변경</text>

  <!-- lane: code deploy -->
  <rect x="20" y="170" width="820" height="86" rx="10" fill="#e8f4f8" stroke="#2980b9" stroke-width="2"/>
  <text x="40" y="218" class="lane-t" fill="#2980b9">코드 배포</text>

  <!-- infra lane boxes -->
  <rect x="160" y="77" width="130" height="44" rx="6" class="box" filter="url(#s)"/>
  <text x="225" y="104" class="box-t">작업 정의 수정</text>
  <rect x="350" y="77" width="130" height="44" rx="6" class="box" filter="url(#s)"/>
  <text x="415" y="104" class="box-t">Atlantis apply</text>
  <rect x="540" y="77" width="130" height="44" rx="6" class="box" filter="url(#s)"/>
  <text x="605" y="104" class="box-t">S3</text>

  <path d="M290,99 L348,99" class="edge"/>
  <path d="M480,99 L538,99" class="edge"/>

  <!-- deploy lane boxes -->
  <rect x="160" y="191" width="130" height="44" rx="6" class="box" filter="url(#s)"/>
  <text x="225" y="218" class="box-t">앱 레포 push</text>
  <rect x="540" y="191" width="130" height="44" rx="6" class="box" filter="url(#s)"/>
  <text x="605" y="218" class="box-t">CI</text>
  <rect x="700" y="191" width="120" height="44" rx="6" fill="#fff3e0" stroke="#f39c12" stroke-width="1.8" filter="url(#s)"/>
  <text x="760" y="218" class="box-t">ECS 서비스</text>

  <path d="M290,213 L538,213" class="edge"/>
  <path d="M670,213 L698,213" class="edge"/>

  <!-- S3 -> CI -->
  <path d="M605,121 L605,189" class="edge"/>
  <text x="614" y="160" class="edge-t">작업 정의 가져오기</text>
</g>
</svg>
