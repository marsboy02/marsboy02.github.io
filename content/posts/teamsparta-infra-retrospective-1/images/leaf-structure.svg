<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 368"
     font-family="'Pretendard', 'Apple SD Gothic Neo', 'Noto Sans KR', 'Malgun Gothic', 'Inter', -apple-system, sans-serif">
  <defs>
    <filter id="s"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.12"/></filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2980b9"/>
    </marker>
    <marker id="arrow-o" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L10,5 L0,10 z" fill="#f39c12"/>
    </marker>
    <style>
      .acct { font-size: 15px; font-weight: 700; fill: #1a1a2e; }
      .state { font-size: 10.5px; fill: #555; font-family: 'SF Mono', 'Fira Code', monospace; }
      .name { font-size: 13px; font-weight: 700; fill: #1a1a2e; text-anchor: middle; font-family: 'SF Mono', 'Fira Code', monospace; }
      .svc { font-size: 12px; font-weight: 600; fill: #1a1a2e; text-anchor: middle; }
      .path { font-size: 10.5px; fill: #555; text-anchor: middle; font-family: 'SF Mono', 'Fira Code', monospace; }
      .sub { font-size: 10.5px; fill: #888; text-anchor: middle; }
      .own-t { font-size: 11.5px; font-weight: 700; fill: #8e44ad; text-anchor: middle; }
      .shared { fill: #f4e8f8; stroke: #8e44ad; stroke-width: 2; }
      .leaf { fill: #ffffff; stroke: #555; stroke-width: 1.3; }
      .group { fill: #ffffff; fill-opacity: 0.55; stroke: #2980b9; stroke-width: 1.2; stroke-dasharray: 4,3; }
      .group-t { font-size: 11px; font-weight: 700; fill: #2980b9; text-anchor: middle; }
      .chip { fill: #ffffff; stroke: #8e44ad; stroke-width: 1; stroke-dasharray: 3,2; }
      .chip-t { font-size: 10px; fill: #8e44ad; text-anchor: middle; font-family: 'SF Mono', 'Fira Code', monospace; }
      .alb { fill: #fff3e0; stroke: #f39c12; stroke-width: 1.5; }
      .edge { stroke: #2980b9; stroke-width: 1.8; fill: none; marker-end: url(#arrow); }
      .edge-o { stroke: #f39c12; stroke-width: 1.5; fill: none; stroke-dasharray: 4,3; marker-end: url(#arrow-o); }
      .tag-bg { fill: #ffffff; stroke: #2980b9; stroke-width: 1; }
      .tag { font-size: 10px; fill: #2980b9; text-anchor: middle; font-family: 'SF Mono', 'Fira Code', monospace; }
      .more { font-size: 11px; fill: #888; text-anchor: middle; }
    </style>
  </defs>

  <rect width="860" height="368" fill="#f8fafc" rx="12"/>
  <text x="430" y="34" text-anchor="middle" font-size="18" font-weight="700" fill="#1a1a2e">non-prod는 환경마다 공용 클러스터 하나, prod는 서비스마다 클러스터 하나</text>
  <rect x="20" y="56" width="520" height="292" rx="10" fill="#e8f4f8" stroke="#2980b9" stroke-width="2"/>
  <text x="40" y="84" class="acct">non-prod 계정</text>
  <text x="40" y="102" class="state">state: &lt;non-prod-account&gt;-tfstate</text>
  <rect x="40" y="120" width="150" height="56" rx="8" class="shared" filter="url(#s)"/>
  <text x="115" y="143" class="name">dev-shared</text>
  <text x="115" y="163" class="own-t">공용 클러스터 · ALB</text>
  <path d="M115,176 L115,226" class="edge"/>
  <rect x="75" y="192" width="80" height="18" rx="4" class="tag-bg"/>
  <text x="115" y="205" class="tag">remote_state</text>
  <rect x="40" y="228" width="150" height="100" rx="8" class="group"/>
  <rect x="50" y="240" width="130" height="34" rx="6" class="leaf"/>
  <text x="115" y="262" class="svc">example-backend</text>
  <rect x="50" y="282" width="130" height="34" rx="6" class="leaf"/>
  <text x="115" y="304" class="svc">another-api</text>
  <rect x="210" y="120" width="150" height="56" rx="8" class="shared" filter="url(#s)"/>
  <text x="285" y="143" class="name">test-shared</text>
  <text x="285" y="163" class="own-t">공용 클러스터 · ALB</text>
  <path d="M285,176 L285,226" class="edge"/>
  <rect x="245" y="192" width="80" height="18" rx="4" class="tag-bg"/>
  <text x="285" y="205" class="tag">remote_state</text>
  <rect x="210" y="228" width="150" height="100" rx="8" class="group"/>
  <rect x="220" y="240" width="130" height="34" rx="6" class="leaf"/>
  <text x="285" y="262" class="svc">example-backend</text>
  <rect x="220" y="282" width="130" height="34" rx="6" class="leaf"/>
  <text x="285" y="304" class="svc">another-api</text>
  <rect x="380" y="120" width="150" height="56" rx="8" class="shared" filter="url(#s)"/>
  <text x="455" y="143" class="name">stage-shared</text>
  <text x="455" y="163" class="own-t">공용 클러스터 · ALB</text>
  <path d="M455,176 L455,226" class="edge"/>
  <rect x="415" y="192" width="80" height="18" rx="4" class="tag-bg"/>
  <text x="455" y="205" class="tag">remote_state</text>
  <rect x="380" y="228" width="150" height="100" rx="8" class="group"/>
  <rect x="390" y="240" width="130" height="34" rx="6" class="leaf"/>
  <text x="455" y="262" class="svc">example-backend</text>
  <rect x="390" y="282" width="130" height="34" rx="6" class="leaf"/>
  <text x="455" y="304" class="svc">another-api</text>
  <rect x="560" y="56" width="280" height="292" rx="10" fill="#fde8e8" stroke="#e74c3c" stroke-width="2"/>
  <text x="580" y="84" class="acct">prod 계정</text>
  <text x="580" y="102" class="state">state: &lt;prod-account&gt;-tfstate</text>
  <rect x="580" y="120" width="240" height="72" rx="8" class="shared" filter="url(#s)"/>
  <text x="700" y="143" class="name">clusters</text>
  <rect x="592" y="156" width="66" height="24" rx="5" class="chip"/>
  <text x="625" y="172" class="chip-t">cluster A</text>
  <rect x="667" y="156" width="66" height="24" rx="5" class="chip"/>
  <text x="700" y="172" class="chip-t">cluster B</text>
  <rect x="742" y="156" width="66" height="24" rx="5" class="chip"/>
  <text x="775" y="172" class="chip-t">…</text>
  <path d="M625,180 L635,226" class="edge"/>
  <path d="M700,180 L765,226" class="edge"/>
  <rect x="580" y="228" width="110" height="36" rx="6" class="leaf" filter="url(#s)"/>
  <text x="635" y="251" class="svc">example-backend</text>
  <rect x="710" y="228" width="110" height="36" rx="6" class="leaf" filter="url(#s)"/>
  <text x="765" y="251" class="svc">another-api</text>
  <path d="M635,264 L635,290" class="edge-o"/>
  <path d="M765,264 L765,290" class="edge-o"/>
  <rect x="580" y="292" width="110" height="36" rx="6" class="alb"/>
  <text x="635" y="315" class="svc">전용 ALB</text>
  <rect x="710" y="292" width="110" height="36" rx="6" class="alb"/>
  <text x="765" y="315" class="svc">전용 ALB</text>
</svg>
