<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 200"
     font-family="'Inter', 'Segoe UI', -apple-system, sans-serif">
  <defs>
    <filter id="s"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.12"/></filter>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#888888"/>
    </marker>
  </defs>

  <rect width="860" height="200" fill="#f8fafc" rx="12"/>

  <!-- Redis -->
  <rect x="27" y="50" width="168" height="100" rx="10" fill="#fdeceb" stroke="#c0392b" stroke-width="2.5" filter="url(#s)"/>
  <text x="111" y="86" text-anchor="middle" font-size="16" font-weight="700" fill="#c0392b">Redis</text>
  <text x="111" y="110" text-anchor="middle" font-size="11.5" font-family="'SFMono-Regular', Menlo, monospace" fill="#1a1a2e">:6379</text>
  <text x="111" y="132" text-anchor="middle" font-size="10.5" fill="#888">monitoring target</text>

  <path d="M 199 104 L 236 104" fill="none" stroke="#888888" stroke-width="2" marker-end="url(#a)"/>
  <text x="217" y="90" text-anchor="middle" font-size="10.5" font-weight="600" fill="#555">INFO</text>

  <!-- redis-exporter -->
  <rect x="240" y="50" width="168" height="100" rx="10" fill="#e8f4f8" stroke="#2980b9" stroke-width="2.5" filter="url(#s)"/>
  <text x="324" y="86" text-anchor="middle" font-size="15" font-weight="700" fill="#2980b9">redis-exporter</text>
  <text x="324" y="110" text-anchor="middle" font-size="11.5" font-family="'SFMono-Regular', Menlo, monospace" fill="#1a1a2e">:9121/metrics</text>
  <text x="324" y="132" text-anchor="middle" font-size="10.5" fill="#888">translates INFO</text>

  <path d="M 412 104 L 449 104" fill="none" stroke="#888888" stroke-width="2" marker-end="url(#a)"/>
  <text x="430" y="90" text-anchor="middle" font-size="10.5" font-weight="600" fill="#555">scrape</text>

  <!-- Prometheus -->
  <rect x="453" y="50" width="168" height="100" rx="10" fill="#fdece8" stroke="#e6522c" stroke-width="2.5" filter="url(#s)"/>
  <text x="537" y="86" text-anchor="middle" font-size="16" font-weight="700" fill="#e6522c">Prometheus</text>
  <text x="537" y="110" text-anchor="middle" font-size="11.5" font-family="'SFMono-Regular', Menlo, monospace" fill="#1a1a2e">:9090</text>
  <text x="537" y="132" text-anchor="middle" font-size="10.5" fill="#888">stores in TSDB</text>

  <path d="M 625 104 L 662 104" fill="none" stroke="#888888" stroke-width="2" marker-end="url(#a)"/>
  <text x="643" y="90" text-anchor="middle" font-size="10.5" font-weight="600" fill="#555">PromQL</text>

  <!-- Grafana -->
  <rect x="666" y="50" width="168" height="100" rx="10" fill="#fff3e0" stroke="#f39c12" stroke-width="2.5" filter="url(#s)"/>
  <text x="750" y="86" text-anchor="middle" font-size="16" font-weight="700" fill="#f39c12">Grafana</text>
  <text x="750" y="110" text-anchor="middle" font-size="11.5" font-family="'SFMono-Regular', Menlo, monospace" fill="#1a1a2e">:3000</text>
  <text x="750" y="132" text-anchor="middle" font-size="10.5" fill="#888">dashboard 11835</text>
</svg>
