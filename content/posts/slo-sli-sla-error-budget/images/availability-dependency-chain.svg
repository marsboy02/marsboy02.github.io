  <rect x="32" y="80" width="224" height="30" rx="6" fill="#ffffff" stroke="#c8c8c8" stroke-width="1"/>
  <text x="44" y="100" font-size="12" font-weight="600" fill="#1a1a2e">Home power</text>
  <text x="244" y="100" text-anchor="end" font-size="12" font-weight="700" fill="#1a1a2e">99.9%</text>

  <rect x="32" y="116" width="224" height="30" rx="6" fill="#ffffff" stroke="#c8c8c8" stroke-width="1"/>
  <text x="44" y="136" font-size="12" font-weight="600" fill="#1a1a2e">Wi-Fi router</text>
  <text x="244" y="136" text-anchor="end" font-size="12" font-weight="700" fill="#1a1a2e">99.9%</text>

  <rect x="32" y="152" width="224" height="30" rx="6" fill="#fff3e0" stroke="#f39c12" stroke-width="1.5"/>
