<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 332" font-family="'Inter', 'Segoe UI', -apple-system, sans-serif">
  <defs>
    <filter id="s"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.12"/></filter>
    <marker id="ag" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#64748b"/></marker>
    <marker id="ae" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#27ae60"/></marker>
  </defs>
  <rect width="820" height="332" fill="#f8fafc" rx="12"/>
  <text x="410" y="32" text-anchor="middle" font-size="18" font-weight="700" fill="#0f172a">Where eBPF Hooks Sit Relative to Netfilter</text>

  <!-- legend -->
  <rect x="560" y="46" width="12" height="12" rx="3" fill="#27ae60" fill-opacity="0.25" stroke="#27ae60" stroke-width="1.5"/>
  <text x="578" y="56" font-size="10" fill="#475569">eBPF hook</text>
  <rect x="650" y="46" width="12" height="12" rx="3" fill="#f39c12" fill-opacity="0.25" stroke="#f39c12" stroke-width="1.5"/>
  <text x="668" y="56" font-size="10" fill="#475569">Netfilter hook</text>
  <rect x="750" y="46" width="12" height="12" rx="3" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="768" y="56" font-size="10" fill="#475569">stack</text>

  <!-- ===== ROW 1: Receive path ===== -->
  <text x="24" y="86" font-size="11" font-weight="700" fill="#475569">RECEIVE (NIC → socket)</text>
  <rect x="16" y="94" width="788" height="92" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>

  <!-- NIC driver -->
  <rect x="28" y="118" width="80" height="44" rx="7" fill="#ffffff" stroke="#94a3b8" stroke-width="1.4" filter="url(#s)"/>
  <text x="68" y="137" text-anchor="middle" font-size="11" font-weight="600" fill="#0f172a">NIC driver</text>
  <text x="68" y="152" text-anchor="middle" font-size="9" fill="#64748b">DMA ring</text>
  <line x1="109" y1="140" x2="124" y2="140" stroke="#64748b" stroke-width="1.6" marker-end="url(#ag)"/>

  <!-- XDP -->
  <rect x="125" y="118" width="70" height="44" rx="7" fill="#27ae60" fill-opacity="0.2" stroke="#27ae60" stroke-width="1.8" filter="url(#s)"/>
  <text x="160" y="137" text-anchor="middle" font-size="11" font-weight="700" fill="#1a7a45">XDP</text>
  <text x="160" y="152" text-anchor="middle" font-size="9" fill="#1a7a45">no sk_buff yet</text>
  <line x1="196" y1="140" x2="211" y2="140" stroke="#64748b" stroke-width="1.6" marker-end="url(#ag)"/>

  <!-- sk_buff -->
  <rect x="212" y="118" width="78" height="44" rx="7" fill="#ffffff" stroke="#94a3b8" stroke-width="1.4" filter="url(#s)"/>
  <text x="251" y="137" text-anchor="middle" font-size="11" font-weight="600" fill="#0f172a">sk_buff</text>
  <text x="251" y="152" text-anchor="middle" font-size="9" fill="#64748b">allocation</text>
  <line x1="291" y1="140" x2="306" y2="140" stroke="#64748b" stroke-width="1.6" marker-end="url(#ag)"/>

  <!-- tc ingress -->
  <rect x="307" y="118" width="84" height="44" rx="7" fill="#27ae60" fill-opacity="0.2" stroke="#27ae60" stroke-width="1.8" filter="url(#s)"/>
  <text x="349" y="137" text-anchor="middle" font-size="11" font-weight="700" fill="#1a7a45">tc ingress</text>
  <text x="349" y="152" text-anchor="middle" font-size="9" fill="#1a7a45">per interface</text>
  <line x1="392" y1="140" x2="407" y2="140" stroke="#64748b" stroke-width="1.6" marker-end="url(#ag)"/>

  <!-- PREROUTING -->
  <rect x="408" y="118" width="100" height="44" rx="7" fill="#f39c12" fill-opacity="0.2" stroke="#f39c12" stroke-width="1.8" filter="url(#s)"/>
  <text x="458" y="137" text-anchor="middle" font-size="10.5" font-weight="700" fill="#c0700a">PREROUTING</text>
  <text x="458" y="152" text-anchor="middle" font-size="8.5" fill="#c0700a">nat DNAT · conntrack</text>
  <line x1="509" y1="140" x2="522" y2="140" stroke="#64748b" stroke-width="1.6" marker-end="url(#ag)"/>

  <!-- Routing -->
  <rect x="523" y="118" width="70" height="44" rx="7" fill="#ffffff" stroke="#94a3b8" stroke-width="1.4" filter="url(#s)"/>
  <text x="558" y="137" text-anchor="middle" font-size="11" font-weight="600" fill="#0f172a">Routing</text>
  <text x="558" y="152" text-anchor="middle" font-size="8.5" fill="#64748b">local / forward?</text>
  <line x1="594" y1="140" x2="607" y2="140" stroke="#64748b" stroke-width="1.6" marker-end="url(#ag)"/>

  <!-- INPUT / FORWARD -->
  <rect x="608" y="118" width="108" height="44" rx="7" fill="#f39c12" fill-opacity="0.2" stroke="#f39c12" stroke-width="1.8" filter="url(#s)"/>
  <text x="662" y="137" text-anchor="middle" font-size="10" font-weight="700" fill="#c0700a">INPUT / FORWARD</text>
  <text x="662" y="152" text-anchor="middle" font-size="8.5" fill="#c0700a">filter · policy chains</text>
  <line x1="717" y1="140" x2="728" y2="140" stroke="#64748b" stroke-width="1.6" marker-end="url(#ag)"/>

  <!-- Socket -->
  <rect x="729" y="118" width="64" height="44" rx="7" fill="#ffffff" stroke="#94a3b8" stroke-width="1.4" filter="url(#s)"/>
  <text x="761" y="137" text-anchor="middle" font-size="11" font-weight="600" fill="#0f172a">Socket</text>
  <text x="761" y="152" text-anchor="middle" font-size="9" fill="#64748b">TCP/IP</text>

  <!-- redirect shortcut from tc ingress -->
  <path d="M 349 163 C 349 182, 420 182, 480 180 L 760 180 L 760 164" fill="none" stroke="#27ae60" stroke-width="1.6" stroke-dasharray="5,3" marker-end="url(#ae)"/>
  <text x="560" y="178" text-anchor="middle" font-size="9" font-weight="600" fill="#27ae60">bpf_redirect → everything in between is skipped</text>

  <!-- ===== ROW 2: Transmit path ===== -->
  <text x="24" y="218" font-size="11" font-weight="700" fill="#475569">TRANSMIT (socket → NIC)</text>
  <rect x="16" y="226" width="788" height="92" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>

  <!-- App syscall -->
  <rect x="28" y="250" width="84" height="44" rx="7" fill="#ffffff" stroke="#94a3b8" stroke-width="1.4" filter="url(#s)"/>
  <text x="70" y="269" text-anchor="middle" font-size="11" font-weight="600" fill="#0f172a">connect()</text>
  <text x="70" y="284" text-anchor="middle" font-size="9" fill="#64748b">sendmsg()</text>
  <line x1="113" y1="272" x2="128" y2="272" stroke="#64748b" stroke-width="1.6" marker-end="url(#ag)"/>

  <!-- cgroup socket hook -->
  <rect x="129" y="250" width="94" height="44" rx="7" fill="#27ae60" fill-opacity="0.2" stroke="#27ae60" stroke-width="1.8" filter="url(#s)"/>
  <text x="176" y="269" text-anchor="middle" font-size="11" font-weight="700" fill="#1a7a45">cgroup sock</text>
  <text x="176" y="284" text-anchor="middle" font-size="9" fill="#1a7a45">no packet yet</text>
  <line x1="224" y1="272" x2="239" y2="272" stroke="#64748b" stroke-width="1.6" marker-end="url(#ag)"/>

  <!-- TCP/IP -->
  <rect x="240" y="250" width="70" height="44" rx="7" fill="#ffffff" stroke="#94a3b8" stroke-width="1.4" filter="url(#s)"/>
  <text x="275" y="269" text-anchor="middle" font-size="11" font-weight="600" fill="#0f172a">TCP/IP</text>
  <text x="275" y="284" text-anchor="middle" font-size="9" fill="#64748b">build packet</text>
  <line x1="311" y1="272" x2="326" y2="272" stroke="#64748b" stroke-width="1.6" marker-end="url(#ag)"/>

  <!-- OUTPUT -->
  <rect x="327" y="250" width="80" height="44" rx="7" fill="#f39c12" fill-opacity="0.2" stroke="#f39c12" stroke-width="1.8" filter="url(#s)"/>
  <text x="367" y="269" text-anchor="middle" font-size="11" font-weight="700" fill="#c0700a">OUTPUT</text>
  <text x="367" y="284" text-anchor="middle" font-size="9" fill="#c0700a">nat · filter</text>
  <line x1="408" y1="272" x2="423" y2="272" stroke="#64748b" stroke-width="1.6" marker-end="url(#ag)"/>

  <!-- Routing -->
  <rect x="424" y="250" width="74" height="44" rx="7" fill="#ffffff" stroke="#94a3b8" stroke-width="1.4" filter="url(#s)"/>
  <text x="461" y="269" text-anchor="middle" font-size="11" font-weight="600" fill="#0f172a">Routing</text>
  <text x="461" y="284" text-anchor="middle" font-size="9" fill="#64748b">pick egress dev</text>
  <line x1="499" y1="272" x2="514" y2="272" stroke="#64748b" stroke-width="1.6" marker-end="url(#ag)"/>

  <!-- POSTROUTING -->
  <rect x="515" y="250" width="104" height="44" rx="7" fill="#f39c12" fill-opacity="0.2" stroke="#f39c12" stroke-width="1.8" filter="url(#s)"/>
  <text x="567" y="269" text-anchor="middle" font-size="11" font-weight="700" fill="#c0700a">POSTROUTING</text>
  <text x="567" y="284" text-anchor="middle" font-size="9" fill="#c0700a">nat SNAT / MASQ</text>
  <line x1="620" y1="272" x2="635" y2="272" stroke="#64748b" stroke-width="1.6" marker-end="url(#ag)"/>

  <!-- tc egress -->
  <rect x="636" y="250" width="80" height="44" rx="7" fill="#27ae60" fill-opacity="0.2" stroke="#27ae60" stroke-width="1.8" filter="url(#s)"/>
  <text x="676" y="269" text-anchor="middle" font-size="11" font-weight="700" fill="#1a7a45">tc egress</text>
  <text x="676" y="284" text-anchor="middle" font-size="9" fill="#1a7a45">per interface</text>
  <line x1="717" y1="272" x2="732" y2="272" stroke="#64748b" stroke-width="1.6" marker-end="url(#ag)"/>

  <!-- NIC driver -->
  <rect x="733" y="250" width="60" height="44" rx="7" fill="#ffffff" stroke="#94a3b8" stroke-width="1.4" filter="url(#s)"/>
  <text x="763" y="269" text-anchor="middle" font-size="11" font-weight="600" fill="#0f172a">NIC</text>
  <text x="763" y="284" text-anchor="middle" font-size="9" fill="#64748b">driver</text>

  <!-- socket LB annotation -->
  <text x="176" y="312" text-anchor="middle" font-size="9" font-weight="600" fill="#27ae60">Cilium rewrites the socket's destination here</text>

</svg>
