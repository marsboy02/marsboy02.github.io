<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 390" font-family="'Inter', 'Segoe UI', -apple-system, sans-serif">
  <defs>
    <filter id="s"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.12"/></filter>
    <marker id="ag" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#94a3b8"/></marker>
    <marker id="ao" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#f39c12"/></marker>
    <marker id="ae" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#27ae60"/></marker>
  </defs>
  <rect width="820" height="390" fill="#f8fafc" rx="12"/>
  <text x="410" y="32" text-anchor="middle" font-size="18" font-weight="700" fill="#0f172a">Two Ways into the Kernel: Data vs. Code</text>

  <!-- ===== LEFT: Before eBPF ===== -->
  <text x="200" y="62" text-anchor="middle" font-size="12" font-weight="700" fill="#f39c12">Before eBPF — configuration passes DATA</text>
  <rect x="24" y="70" width="352" height="306" rx="10" fill="#fff8ec" stroke="#f39c12" stroke-width="1" opacity="0.9"/>

  <!-- User space -->
  <text x="40" y="92" font-size="10" font-weight="700" fill="#64748b">USER SPACE</text>
  <rect x="40" y="98" width="96" height="36" rx="6" fill="#ffffff" stroke="#94a3b8" stroke-width="1.2" filter="url(#s)"/>
  <text x="88" y="120" text-anchor="middle" font-size="11" font-weight="600" fill="#0f172a">ip route</text>
  <rect x="152" y="98" width="96" height="36" rx="6" fill="#ffffff" stroke="#94a3b8" stroke-width="1.2" filter="url(#s)"/>
  <text x="200" y="120" text-anchor="middle" font-size="11" font-weight="600" fill="#0f172a">iptables</text>
  <rect x="264" y="98" width="96" height="36" rx="6" fill="#ffffff" stroke="#94a3b8" stroke-width="1.2" filter="url(#s)"/>
  <text x="312" y="120" text-anchor="middle" font-size="11" font-weight="600" fill="#0f172a">Felix / flanneld</text>

  <!-- arrows down to configuration -->
  <line x1="88" y1="135" x2="88" y2="160" stroke="#f39c12" stroke-width="1.6" marker-end="url(#ao)"/>
  <line x1="200" y1="135" x2="200" y2="160" stroke="#f39c12" stroke-width="1.6" marker-end="url(#ao)"/>
  <line x1="312" y1="135" x2="312" y2="160" stroke="#f39c12" stroke-width="1.6" marker-end="url(#ao)"/>

  <!-- Configuration interface -->
  <rect x="40" y="162" width="320" height="40" rx="8" fill="#f39c12" fill-opacity="0.18" stroke="#f39c12" stroke-width="1.8" filter="url(#s)"/>
  <text x="200" y="179" text-anchor="middle" font-size="11" font-weight="700" fill="#c0700a">Configuration interface</text>
  <text x="200" y="194" text-anchor="middle" font-size="10" fill="#c0700a">netlink · sysfs · procfs</text>

  <!-- dashed kernel boundary -->
  <line x1="32" y1="214" x2="368" y2="214" stroke="#94a3b8" stroke-width="1" stroke-dasharray="5,4"/>
  <text x="40" y="230" font-size="10" font-weight="700" fill="#64748b">KERNEL</text>

  <!-- Kernel data structures -->
  <rect x="40" y="238" width="96" height="56" rx="6" fill="#ffffff" stroke="#94a3b8" stroke-width="1.2" filter="url(#s)"/>
  <text x="88" y="261" text-anchor="middle" font-size="11" font-weight="600" fill="#0f172a">Routing table</text>
  <text x="88" y="277" text-anchor="middle" font-size="9" fill="#64748b">data</text>
  <rect x="152" y="238" width="96" height="56" rx="6" fill="#ffffff" stroke="#94a3b8" stroke-width="1.2" filter="url(#s)"/>
  <text x="200" y="261" text-anchor="middle" font-size="11" font-weight="600" fill="#0f172a">Netfilter chains</text>
  <text x="200" y="277" text-anchor="middle" font-size="9" fill="#64748b">data</text>
  <rect x="264" y="238" width="96" height="56" rx="6" fill="#ffffff" stroke="#94a3b8" stroke-width="1.2" filter="url(#s)"/>
  <text x="312" y="261" text-anchor="middle" font-size="11" font-weight="600" fill="#0f172a">FDB / ARP</text>
  <text x="312" y="277" text-anchor="middle" font-size="9" fill="#64748b">data</text>

  <line x1="200" y1="203" x2="200" y2="236" stroke="#f39c12" stroke-width="1.6" marker-end="url(#ao)"/>
  <line x1="88" y1="203" x2="88" y2="236" stroke="#f39c12" stroke-width="1.6" marker-end="url(#ao)"/>
  <line x1="312" y1="203" x2="312" y2="236" stroke="#f39c12" stroke-width="1.6" marker-end="url(#ao)"/>

  <!-- Fixed kernel code -->
  <rect x="40" y="308" width="320" height="52" rx="8" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="200" y="329" text-anchor="middle" font-size="11" font-weight="700" fill="#475569">Kernel code that READS the data — fixed</text>
  <text x="200" y="346" text-anchor="middle" font-size="10" fill="#64748b">LPM lookup · linear chain walk · bridge forwarding</text>

  <!-- ===== RIGHT: With eBPF ===== -->
  <text x="620" y="62" text-anchor="middle" font-size="12" font-weight="700" fill="#27ae60">With eBPF — bpf() passes CODE</text>
  <rect x="444" y="70" width="352" height="306" rx="10" fill="#eaf7ee" stroke="#27ae60" stroke-width="1" opacity="0.9"/>

  <text x="460" y="92" font-size="10" font-weight="700" fill="#64748b">USER SPACE</text>
  <rect x="460" y="98" width="150" height="36" rx="6" fill="#ffffff" stroke="#94a3b8" stroke-width="1.2" filter="url(#s)"/>
  <text x="535" y="114" text-anchor="middle" font-size="11" font-weight="600" fill="#0f172a">cilium-agent</text>
  <text x="535" y="127" text-anchor="middle" font-size="9" fill="#64748b">loader (cilium/ebpf)</text>
  <rect x="630" y="98" width="150" height="36" rx="6" fill="#ffffff" stroke="#94a3b8" stroke-width="1.2" filter="url(#s)"/>
  <text x="705" y="114" text-anchor="middle" font-size="11" font-weight="600" fill="#0f172a">eBPF bytecode</text>
  <text x="705" y="127" text-anchor="middle" font-size="9" fill="#64748b">+ map definitions</text>

  <line x1="535" y1="135" x2="535" y2="160" stroke="#27ae60" stroke-width="1.8" marker-end="url(#ae)"/>
  <line x1="705" y1="135" x2="705" y2="160" stroke="#27ae60" stroke-width="1.8" marker-end="url(#ae)"/>

  <!-- bpf() syscall -->
  <rect x="460" y="162" width="320" height="40" rx="8" fill="#27ae60" fill-opacity="0.15" stroke="#27ae60" stroke-width="1.8" filter="url(#s)"/>
  <text x="620" y="179" text-anchor="middle" font-size="11" font-weight="700" fill="#1a7a45">bpf() syscall</text>
  <text x="620" y="194" text-anchor="middle" font-size="10" fill="#1a7a45">load program · create map · attach to hook</text>

  <line x1="452" y1="214" x2="788" y2="214" stroke="#94a3b8" stroke-width="1" stroke-dasharray="5,4"/>
  <text x="460" y="230" font-size="10" font-weight="700" fill="#64748b">KERNEL</text>

  <!-- Verifier -> JIT -> Hook -->
  <rect x="460" y="238" width="90" height="56" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.4" filter="url(#s)"/>
  <text x="505" y="261" text-anchor="middle" font-size="11" font-weight="600" fill="#0f172a">Verifier</text>
  <text x="505" y="277" text-anchor="middle" font-size="9" fill="#64748b">proves safety</text>
  <line x1="551" y1="266" x2="574" y2="266" stroke="#27ae60" stroke-width="1.6" marker-end="url(#ae)"/>
  <rect x="575" y="238" width="90" height="56" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.4" filter="url(#s)"/>
  <text x="620" y="261" text-anchor="middle" font-size="11" font-weight="600" fill="#0f172a">JIT</text>
  <text x="620" y="277" text-anchor="middle" font-size="9" fill="#64748b">native code</text>
  <line x1="666" y1="266" x2="689" y2="266" stroke="#27ae60" stroke-width="1.6" marker-end="url(#ae)"/>
  <rect x="690" y="238" width="90" height="56" rx="6" fill="#27ae60" fill-opacity="0.15" stroke="#27ae60" stroke-width="1.8" filter="url(#s)"/>
  <text x="735" y="261" text-anchor="middle" font-size="11" font-weight="700" fill="#1a7a45">Hook</text>
  <text x="735" y="277" text-anchor="middle" font-size="9" fill="#1a7a45">tc · XDP · cgroup</text>

  <line x1="620" y1="203" x2="505" y2="236" stroke="#27ae60" stroke-width="1.6" marker-end="url(#ae)"/>

  <!-- Maps -->
  <rect x="460" y="308" width="320" height="52" rx="8" fill="#ffffff" stroke="#27ae60" stroke-width="1.4" filter="url(#s)"/>
  <text x="620" y="329" text-anchor="middle" font-size="11" font-weight="700" fill="#1a7a45">eBPF Maps — shared state</text>
  <text x="620" y="346" text-anchor="middle" font-size="10" fill="#64748b">read/written by the loader AND by programs at hooks</text>
  <line x1="735" y1="295" x2="735" y2="306" stroke="#94a3b8" stroke-width="1.4" marker-end="url(#ag)"/>
  <path d="M 466 203 L 452 203 L 452 334 L 458 334" fill="none" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="4,3" marker-end="url(#ag)"/>
</svg>
