<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 336" font-family="'Inter', 'Segoe UI', -apple-system, sans-serif">
  <defs>
    <filter id="s"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.12"/></filter>
    <marker id="ar" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#e74c3c"/></marker>
    <marker id="ae" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#27ae60"/></marker>
    <marker id="ag" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#64748b"/></marker>
  </defs>
  <rect width="820" height="336" fill="#f8fafc" rx="12"/>
  <text x="410" y="32" text-anchor="middle" font-size="18" font-weight="700" fill="#0f172a">Linear Chain Walk vs. Hash Map Lookup</text>

  <!-- ===== LEFT: iptables chain ===== -->
  <text x="190" y="62" text-anchor="middle" font-size="12" font-weight="700" fill="#e74c3c">iptables — KUBE-SERVICES chain</text>
  <rect x="24" y="70" width="332" height="250" rx="10" fill="#fff3f0" stroke="#e74c3c" stroke-width="1" opacity="0.9"/>

  <!-- packet -->
  <rect x="40" y="86" width="120" height="34" rx="6" fill="#ffffff" stroke="#94a3b8" stroke-width="1.3" filter="url(#s)"/>
  <text x="100" y="101" text-anchor="middle" font-size="10" font-weight="600" fill="#0f172a">packet</text>
  <text x="100" y="114" text-anchor="middle" font-size="9" fill="#64748b">dst 10.96.45.199:80</text>

  <!-- rules -->
  <g font-size="10">
    <rect x="176" y="86" width="172" height="22" rx="4" fill="#ffffff" stroke="#e74c3c" stroke-width="1.2"/>
    <text x="182" y="101" font-size="9.5" fill="#0f172a">rule 1   -d 10.96.45.10  → SVC-A</text>
    <rect x="176" y="112" width="172" height="22" rx="4" fill="#ffffff" stroke="#e74c3c" stroke-width="1.2"/>
    <text x="182" y="127" font-size="9.5" fill="#0f172a">rule 2   -d 10.96.45.11  → SVC-B</text>
    <rect x="176" y="138" width="172" height="22" rx="4" fill="#ffffff" stroke="#e74c3c" stroke-width="1.2"/>
    <text x="182" y="153" font-size="9.5" fill="#0f172a">rule 3   -d 10.96.45.12  → SVC-C</text>
    <text x="260" y="178" text-anchor="middle" fill="#94a3b8" font-size="12">⋮</text>
    <rect x="176" y="188" width="172" height="22" rx="4" fill="#ffffff" stroke="#e74c3c" stroke-width="1.2"/>
    <text x="182" y="203" font-size="9.5" fill="#0f172a">rule N-1 -d 10.96.45.198 → …</text>
    <rect x="176" y="214" width="172" height="22" rx="4" fill="#e74c3c" fill-opacity="0.18" stroke="#e74c3c" stroke-width="1.6"/>
    <text x="182" y="229" font-size="9.5" fill="#9b2c1f" font-weight="700">rule N   -d 10.96.45.199 → SVC-Z ✓</text>
  </g>

  <!-- walk arrows -->
  <line x1="161" y1="97" x2="174" y2="97" stroke="#e74c3c" stroke-width="1.6" marker-end="url(#ar)"/>
  <path d="M 168 108 L 168 225 L 174 225" fill="none" stroke="#e74c3c" stroke-width="1.6" stroke-dasharray="3,3" marker-end="url(#ar)"/>
  <text x="166" y="170" text-anchor="end" font-size="9" fill="#e74c3c">compare</text>
  <text x="166" y="182" text-anchor="end" font-size="9" fill="#e74c3c">N times</text>

  <!-- left summary -->
  <rect x="40" y="250" width="300" height="58" rx="8" fill="#ffffff" stroke="#e74c3c" stroke-width="1.2"/>
  <text x="190" y="268" text-anchor="middle" font-size="11" font-weight="700" fill="#e74c3c">lookup  O(N)   ·   N ≈ Services × Endpoints</text>
  <text x="190" y="284" text-anchor="middle" font-size="10" fill="#475569">update: iptables-restore rewrites the whole table</text>
  <text x="190" y="299" text-anchor="middle" font-size="10" fill="#475569">every Pod add/remove → full rewrite</text>

  <!-- ===== RIGHT: eBPF map ===== -->
  <text x="630" y="62" text-anchor="middle" font-size="12" font-weight="700" fill="#27ae60">eBPF — lb hash map</text>
  <rect x="464" y="70" width="332" height="250" rx="10" fill="#eaf7ee" stroke="#27ae60" stroke-width="1" opacity="0.9"/>

  <!-- packet -->
  <rect x="480" y="86" width="120" height="34" rx="6" fill="#ffffff" stroke="#94a3b8" stroke-width="1.3" filter="url(#s)"/>
  <text x="540" y="101" text-anchor="middle" font-size="10" font-weight="600" fill="#0f172a">packet / connect()</text>
  <text x="540" y="114" text-anchor="middle" font-size="9" fill="#64748b">dst 10.96.45.199:80</text>

  <!-- hash function -->
  <rect x="480" y="136" width="120" height="34" rx="6" fill="#27ae60" fill-opacity="0.18" stroke="#27ae60" stroke-width="1.6" filter="url(#s)"/>
  <text x="540" y="151" text-anchor="middle" font-size="10" font-weight="700" fill="#1a7a45">hash(key)</text>
  <text x="540" y="164" text-anchor="middle" font-size="9" fill="#1a7a45">key = (IP, port, proto)</text>
  <line x1="540" y1="121" x2="540" y2="134" stroke="#27ae60" stroke-width="1.6" marker-end="url(#ae)"/>

  <!-- buckets -->
  <g font-size="10">
    <rect x="620" y="86" width="160" height="22" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
    <text x="628" y="101" fill="#94a3b8">bucket 0</text>
    <rect x="620" y="112" width="160" height="22" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
    <text x="628" y="127" fill="#94a3b8">bucket 1</text>
    <rect x="620" y="138" width="160" height="22" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
    <text x="628" y="153" fill="#94a3b8">bucket 2</text>
    <text x="700" y="178" text-anchor="middle" fill="#94a3b8" font-size="12">⋮</text>
    <rect x="620" y="188" width="172" height="22" rx="4" fill="#27ae60" fill-opacity="0.18" stroke="#27ae60" stroke-width="1.6"/>
    <text x="626" y="203" font-size="9.5" fill="#1a7a45" font-weight="700">bucket k → backends of SVC-Z ✓</text>
    <rect x="620" y="214" width="160" height="22" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
    <text x="628" y="229" fill="#94a3b8">bucket M</text>
  </g>

  <!-- direct jump -->
  <path d="M 601 153 C 612 153, 612 199, 618 199" fill="none" stroke="#27ae60" stroke-width="1.8" marker-end="url(#ae)"/>
  <text x="540" y="188" text-anchor="middle" font-size="9" fill="#27ae60">one jump,</text>
  <text x="540" y="200" text-anchor="middle" font-size="9" fill="#27ae60">no comparisons</text>

  <!-- right summary -->
  <rect x="480" y="250" width="300" height="58" rx="8" fill="#ffffff" stroke="#27ae60" stroke-width="1.2"/>
  <text x="630" y="268" text-anchor="middle" font-size="11" font-weight="700" fill="#27ae60">lookup  O(1)   ·   independent of N</text>
  <text x="630" y="284" text-anchor="middle" font-size="10" fill="#475569">update: one entry, atomic (bpf_map_update_elem)</text>
  <text x="630" y="299" text-anchor="middle" font-size="10" fill="#475569">every Pod add/remove → touch one entry</text>

</svg>
